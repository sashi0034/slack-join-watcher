display_information:
  name: Join Watcher
  description: Announces channel joins to a configured channel.
  background_color: "#2c2d30"

features:
  bot_user:
    display_name: Join Watcher
    always_online: true

oauth_config:
  scopes:
    # Bot only posts (with custom username/icon). It does not need to be a member
    # of every channel it watches — events are received via user_events instead.
    bot:
      - chat:write
      - chat:write.customize
    # User scopes give the app visibility into every channel the installing user
    # is in. `member_joined_channel` events for those channels are delivered via
    # `user_events` below.
    user:
      - channels:read
      - groups:read
      - users:read

settings:
  event_subscriptions:
    user_events:
      - member_joined_channel
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
